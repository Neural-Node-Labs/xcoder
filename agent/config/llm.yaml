# xcoder/agent/config/llm.yaml
# LLM backend configuration for the xcoder agent.
# Default backend: Ollama, running locally/in-container -- no API key needed.
#
# This matches the `ollama` service already defined in docker-compose.yml, which pulls
# qwen2.5-coder:0.5b on first start. Running via `docker compose up`, the api container
# reaches it at http://ollama:11434/v1 (the compose service name doubles as the DNS
# hostname on the shared network). Running the CLI/API directly on the host instead
# (outside Docker), point base_url at your local Ollama install instead:
#   base_url: http://localhost:11434/v1
#
# max_tokens is set well below the model's window: qwen2.5-coder:0.5b is a small local/dev
# model (32K context) meant for running the agent without any cloud key, not for
# production-grade reasoning. Swap in a larger local model (or a cloud provider below) for
# real workloads.
#
# ─── Switching providers ────────────────────────────────────────────────────────
# The active backend is whatever `provider` says here — any OpenAI-compatible provider
# (openai, openrouter, groq, deepseek, ollama, or a custom one) and Anthropic can be
# selected by editing this file + setting one API key env var. No code changes needed.
#
# OpenAI-compatible (explicit base_url/endpoint always win):
#   provider: openai
#   base_url: https://api.openai.com/v1
#   endpoint: /chat/completions
#   model: gpt-5
#   api_key_env: OPENAI_API_KEY
#
# OpenAI-compatible using the known-provider URL registry (base_url/endpoint omitted):
#   provider: openrouter
#   model: anthropic/claude-sonnet-4-5
#   api_key_env: OPENROUTER_API_KEY
#
# DeepSeek (was the previous default -- still fully supported):
#   provider: deepseek
#   model: deepseek-v4-flash
#   api_key_env: DEEPSEEK_API_KEY
#
# Anthropic (fixed Messages API URL; base_url/endpoint are ignored):
#   provider: anthropic
#   model: claude-sonnet-4-5
#   api_key_env: ANTHROPIC_API_KEY
#
# Keys are never inlined here — `api_key_env` names the environment variable holding the key.
# It's optional for Ollama (a local, unauthenticated server) -- left set below purely so a
# reverse-proxied/remote Ollama with its own auth can opt in without changing this file's shape.
provider: ollama
base_url: http://ollama:11434/v1
endpoint: /chat/completions
model: qwen2.5-coder:0.5b
api_key_env: OLLAMA_API_KEY
max_tokens: 4096
temperature: 0.0            # deterministic output for code/math tasks (this is a coding agent)
thinking: false              # qwen2.5-coder:0.5b has no separate thinking-mode API

# Per-skill overrides: every skill uses the same local model by default since there's only
# one pulled by docker-compose. Point these at a stronger provider/model above if you need
# deeper reasoning for RCA/Architect/Pentester work.
overrides:
  rca:
    model: qwen2.5-coder:0.5b
  architect:
    model: qwen2.5-coder:0.5b
  pentester:
    model: qwen2.5-coder:0.5b

# Fallback provider if Ollama is unreachable or the model isn't pulled yet.
fallback:
  provider: ollama
  base_url: http://ollama:11434/v1
  model: qwen2.5-coder:0.5b
  api_key_env: OLLAMA_API_KEY
