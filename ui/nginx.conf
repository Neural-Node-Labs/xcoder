server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SECURITY/RELIABILITY: a plain `proxy_pass http://api:3001/...;` resolves the "api"
    # hostname ONCE, when nginx parses this config at container startup — via the C library
    # resolver, not nginx's own DNS logic. If the api container isn't up yet at that exact
    # moment (still building, still booting, mid-restart, or briefly recreated by Compose),
    # nginx fails with "host not found in upstream" and refuses to start AT ALL — and since
    # that failure happens at startup, it keeps failing on every restart even once api does
    # come up, because nginx never gets far enough to try resolving again.
    #
    # The fix is to force *lazy*, per-request resolution instead: point `resolver` at Docker's
    # own embedded DNS server (always 127.0.0.11 on a Compose-created bridge network), and put
    # the upstream host in a variable rather than a literal string in proxy_pass. Variables in
    # proxy_pass are resolved at request time using the `resolver` directive, with the given
    # TTL, instead of once at config load — so nginx starts immediately regardless of whether
    # api happens to be up yet, and any request that arrives before it is just gets a normal
    # 502 (retried by the client / Vite dev proxy equivalent) instead of the whole container
    # refusing to boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to the xcoder API container (service name "api" in docker-compose.yml).
    # No path segment after $api_upstream in proxy_pass (deliberately) — that makes nginx forward
    # the ORIGINAL request URI unchanged (e.g. "/api/v1/chat" stays exactly "/api/v1/chat" on the
    # way to the api container), rather than doing prefix substitution based on where the
    # location block's match ends. Both behaviors CAN be made to produce the same result, but the
    # substitution form is an easy way to silently end up one segment off if the location prefix
    # and the proxy_pass URI ever drift out of sync during an edit — passing the URI through
    # untouched removes that whole class of mistake, and is correct here specifically because the
    # api container listens on these exact same paths (see server.ts's app.use("/api/v1", ...)).
    location /api/ {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Embedded CodeGraph Explorer + its API proxy — both are served by the xcoder API
    # container (see server.ts's /codegraph-ui and /codegraph-api mounts), not this
    # container, so they need the same upstream forwarding as /api/ above. Without this,
    # the CodeGraph Explorer page works in local dev (single Express process, one origin)
    # but silently 404s behind this SPA's "location /" catch-all in any Docker deployment.
    location /codegraph-ui/ {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /codegraph-api/ {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CodeGraph project uploads can be sizeable source zips.
        client_max_body_size 200m;
        # Cookies gate this proxy at the xcoder layer (see codegraphProxy.ts) — make sure they
        # actually reach the api container instead of being dropped anywhere along the way.
        proxy_pass_header Set-Cookie;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
