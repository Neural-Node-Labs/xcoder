name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API: typecheck, build, unit tests ─────────────────────────────────────
  api:
    name: API — typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  # ─── UI: typecheck, build ───────────────────────────────────────────────────
  ui:
    name: UI — typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build

  # ─── Docker: build both images, smoke-test the compose stack ──────────────
  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build images via docker compose
        run: docker compose build

      - name: Start the stack
        run: |
          cat > .env << 'ENVEOF'
          DATABASE_USER=xcoder
          DATABASE_PASSWORD=xcoder_pass
          DATABASE_NAME=xcoder
          XCODER_MOCK_LLM=1
          ENVEOF
          docker compose up -d

      - name: Wait for the api service to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo "starting")
            echo "  api health: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "api did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Hit the API and dashboard from the host
        run: |
          curl -sf http://localhost:3001/api/v1/health
          curl -sf http://localhost:5173/ > /dev/null

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs || true
