services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-xcoder}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-xcoder_pass}
      POSTGRES_DB: ${DATABASE_NAME:-xcoder}
    volumes:
      - xcoder-postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed on the host for local psql/GUI access; remove if not needed.
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-xcoder} -d ${DATABASE_NAME:-xcoder}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-xcoder}
      DATABASE_USER: ${DATABASE_USER:-xcoder}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-xcoder_pass}
      DATABASE_SSL: "false"
      XCODER_API_PORT: 3001
      XCODER_API_HOST: 0.0.0.0
      # Default backend is Ollama (agent/config/llm.yaml, mounted below) — no key needed.
      # Set these if you switch the mounted llm.yaml to a cloud provider instead.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XCODER_MOCK_LLM: ${XCODER_MOCK_LLM:-}
    volumes:
      # Bakes in agent/config/llm.yaml (Ollama by default) — the Dockerfile doesn't COPY
      # agent/ into the image, so without this mount the container falls back to the
      # DeepSeek default compiled into loadConfig.ts.
      - type: bind
        source: ./agent
        target: /app/agent
        read_only: true
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    # Safe array formatting: No broken string text or mapping value syntax errors
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        if ! ollama list | grep -q 'qwen2.5-coder:0.5b'; then
          echo "Pulling qwen2.5-coder:0.5b..."
          ollama pull qwen2.5-coder:0.5b
        fi
        wait
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - type: bind
        source: ./ollama_models
        target: /root/.ollama


volumes:
  xcoder-postgres-data:
