services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-xcoder}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-xcoder_pass}
      POSTGRES_DB: ${DATABASE_NAME:-xcoder}
    volumes:
      - xcoder-postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed on the host for local psql/GUI access; remove if not needed.
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-xcoder} -d ${DATABASE_NAME:-xcoder}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # Blocks startup until the default model is actually pulled — see ollama-pull-model.
      ollama-pull-model:
        condition: service_completed_successfully
      # The AGI secret must exist before the gateway first reads it. agi itself is NOT a dependency:
      # xcoder starts and works the same whether or not the agent is up (the AGI tab shows "unreachable").
      agi-init:
        condition: service_completed_successfully
      # No depends_on entry for codegraph-api here, even though the environment below points at
      # it — CodeGraph is a sibling service (see codegraph-api further down) and xcoder's core
      # API must come up the same way whether or not it is running, whether the
      # codegraph-api image builds successfully, or how long it takes to become healthy. If
      # XCODER_CODEGRAPH_URL resolves to nothing reachable, autoConnectFromEnv() below just
      # retries for up to 120s, logs a warning, and xcoder proceeds without CodeGraph — it never
      # blocks startup on it.
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-xcoder}
      DATABASE_USER: ${DATABASE_USER:-xcoder}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-xcoder_pass}
      DATABASE_SSL: "false"
      XCODER_API_PORT: 3001
      XCODER_API_HOST: 0.0.0.0
      # Default backend is Ollama (agent/config/llm.yaml, mounted below) — no key needed.
      # Set these if you switch the mounted llm.yaml to a cloud provider instead.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XCODER_MOCK_LLM: ${XCODER_MOCK_LLM:-}
      # CodeGraph runs as its own sibling service in this deployment (see codegraph-api /
      # codegraph-mcp below), not spawned locally — the api image never copies
      # integrations/codegraph/ in and has no Python runtime, so a local spawn isn't even
      # possible here. xcoder logs in as codegraph-api's admin itself at startup (see
      # autoConnectFromEnv() in codegraphProcess.ts) using the same ADMIN_PASSWORD given to
      # codegraph-api below, rather than needing a pre-known API key. These are harmless to
      # leave set even if the codegraph services are scaled to 0 (see below) — xcoder just
      # won't find anything at these URLs and continues without the integration.
      XCODER_CODEGRAPH_URL: http://codegraph-api:8000
      XCODER_CODEGRAPH_ADMIN_PASSWORD: ${CODEGRAPH_ADMIN_PASSWORD:-codegraph_admin_pass}
      XCODER_CODEGRAPH_MCP_URL: http://codegraph-mcp:8900/mcp
      # AGI DevOps agent (bundled, on by default). xcoder's authenticated /api/v1/agi/* gateway is the only
      # way to reach it. The shared secret is generated once by agi-init into the agi_secrets volume (or taken
      # from AGI_API_TOKEN in .env) and read from that file. To turn the feature off set XCODER_AGI_URL=off
      # and run with: --scale agi=0 --scale agi-sandbox=0 --scale agi-jaeger=0 --scale agi-init=0
      XCODER_AGI_URL: ${XCODER_AGI_URL:-http://agi:7000}
      XCODER_AGI_TOKEN_FILE: /secrets/agi_api_token
    volumes:
      - agi_secrets:/secrets:ro
      # Bakes in agent/config/llm.yaml (Ollama by default) — the Dockerfile doesn't COPY
      # agent/ into the image, so without this mount the container falls back to the
      # DeepSeek default compiled into loadConfig.ts.
      - type: bind
        source: ./agent
        target: /app/agent
        read_only: true
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Named volume rather than a ./ollama_models bind mount: model blobs are large, opaque,
      # and root-owned, and a bind mount drops them in the working tree where they get picked
      # up by backups and IDE indexers. Use `docker volume rm xcoder_ollama_storage` to reset.
      - ollama_storage:/root/.ollama
    healthcheck:
      # Deliberately only checks that the server is answering, NOT that any model is pulled.
      # Tying this to model presence would deadlock the stack whenever a pull failed, since
      # `api` waits on this condition. Waiting for the models is ollama-pull-model's job below.
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M

  # ─── One-shot model puller ────────────────────────────────────────────────────
  # Pulls the models the Chat tab's picker offers, then exits. `api` waits on this via
  # `condition: service_completed_successfully`, so the backend never comes up pointing at an
  # Ollama that hasn't got the default model yet — previously the first chat after a cold
  # start would fail with a model-not-found error while the pull was still running.
  #
  # Only granite4:1b (the configured default in agent/config/llm.yaml) is required: if it
  # fails to pull, this container exits non-zero and `api` correctly refuses to start rather
  # than booting into a broken state. The alternates are best-effort — a transient failure
  # pulling one of them shouldn't take the whole stack down, it just means that entry in the
  # model picker isn't available until someone pulls it.
  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: ollama-pull-model
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until curl -sf http://ollama:11434/api/tags > /dev/null; do
          echo "Waiting for ollama..."
          sleep 2
        done

        echo "Pulling required default model: granite4:1b"
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name": "granite4:1b"}'

        for model in qwen2.5:1.5b ministral-3:3b hermes3:3b smollm2:1.7b; do
          echo "Pulling optional model: $$model"
          curl -sf -X POST http://ollama:11434/api/pull -d "{\"name\": \"$$model\"}" \
            || echo "WARNING: could not pull $$model — the model picker will not offer it until it is pulled."
        done

        echo "Model pull complete."

  # ─── CodeGraph (bundled, sibling services) ────────────────────────────────────
  # Runs as its own containers rather than inside the `api` container — the api image has no
  # Python runtime and never copies integrations/codegraph/ in, so a local spawn (what happens
  # in plain `npm run serve` outside Docker — see codegraphProcess.ts) isn't possible here by
  # construction. xcoder's `api` service instead connects to codegraph-api over this compose
  # network and reaches codegraph-mcp as a real network MCP service via streamable-http (see
  # XCODER_CODEGRAPH_URL / XCODER_CODEGRAPH_MCP_URL above).
  #
  # Both start with a plain `docker compose up` — no profile flag needed. (They used to sit
  # behind a `codegraph` profile, which meant the CodeGraph page in the UI was permanently empty
  # unless you knew to pass --profile.) Neither is a dependency of `api`: xcoder connects to
  # codegraph-api in the background and simply runs without it if it never comes up. To run the
  # stack without CodeGraph anyway: `docker compose up --scale codegraph-api=0 --scale codegraph-mcp=0`.
  codegraph-api:
    build:
      context: ./integrations/codegraph/codegraph
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Admin login is how xcoder (and codegraph-mcp, below) obtain a real API key — CodeGraph
      # generates that key itself on first boot, so there's no key to hand out ahead of time,
      # only the password used to log in and fetch it. Set CODEGRAPH_ADMIN_PASSWORD in .env for
      # anything beyond local/eval use.
      ADMIN_PASSWORD: ${CODEGRAPH_ADMIN_PASSWORD:-codegraph_admin_pass}
      CODEGRAPH_SECRET_KEY: ${CODEGRAPH_SECRET_KEY:-change_this_codegraph_secret_key}
    volumes:
      - xcoder-codegraph-data:/data
    ports:
      # Exposed on the host for direct API/debugging access; remove if not needed.
      - "${CODEGRAPH_API_PORT:-8801}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  codegraph-mcp:
    build:
      context: ./integrations/codegraph/codegraph-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      codegraph-api:
        condition: service_healthy
    environment:
      CODEGRAPH_API_URL: http://codegraph-api:8000
      # CODEGRAPH_API_KEY is deliberately left unset — entrypoint.sh fetches a real one at
      # container startup by logging in with this same password (see codegraph-api above).
      ADMIN_PASSWORD: ${CODEGRAPH_ADMIN_PASSWORD:-codegraph_admin_pass}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8900"
    ports:
      # Exposed on the host for debugging with an external MCP client; xcoder's `api` service
      # reaches this over the compose network regardless.
      - "${CODEGRAPH_MCP_PORT:-8900}:8900"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M


  # ─── AGI DevOps agent (bundled, on by default) ────────────────────────────────
  # Isolation model (full table: integrations/agi/UPSTREAM_README.md):
  #   agi         agent + root supervisor. Has egress (LLM API) but executes NOTHING itself.
  #   agi-sandbox ALL command execution. `internal: true` network = no internet, no route to the host.
  #   Neither publishes a host port: the only way in is xcoder's authenticated /api/v1/agi/* gateway.
  # Defaults to the offline scripted "mock" model (AGI_LLM_MODE=anthropic + ANTHROPIC_API_KEY for a real one).
  # Autonomous mode (token-capped loop) is OFF until an admin starts it in the UI (AGI > Schedule).

  # One-shot: creates the two shared secrets on first start (random, 192-bit) and keeps them across restarts.
  # AGI_API_TOKEN / SANDBOX_TOKEN in .env override the generated value (16+ chars).
  agi-init:
    image: alpine:3.20
    restart: "no"
    environment:
      AGI_API_TOKEN: ${AGI_API_TOKEN:-}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    volumes:
      - agi_secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        put() {
          n="$$1"; v="$$2"; f="/secrets/$$n"
          if [ -n "$$v" ]; then
            [ "$$(printf %s "$$v" | wc -c)" -ge 16 ] || { echo "$$n: supplied value must be at least 16 characters" >&2; exit 1; }
            printf %s "$$v" > "$$f"
          elif [ ! -s "$$f" ]; then
            head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"
          fi
          chmod 444 "$$f"
        }
        put agi_api_token "$$AGI_API_TOKEN"
        put sandbox_token "$$SANDBOX_TOKEN"
        echo "agi secrets ready"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 16M

  agi:
    build: ./integrations/agi
    restart: unless-stopped
    environment:
      REQUIRE_API_TOKEN: "1"                 # refuse to start with a missing/placeholder secret
      AGI_API_TOKEN_FILE: /secrets/agi_api_token
      SANDBOX_TOKEN_FILE: /secrets/sandbox_token
      SANDBOX_URL: http://agi-sandbox:9000
      LLM_MODE: ${AGI_LLM_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://agi-jaeger:4318
      EVOLVE_APPROVAL: ${EVOLVE_APPROVAL:-prompts}
      EVOLVE_EPSILON: ${EVOLVE_EPSILON:-}
      PROBATION_SECONDS: ${PROBATION_SECONDS:-90}
      MODEL_EASY: ${MODEL_EASY:-}
      MODEL_MEDIUM: ${MODEL_MEDIUM:-}
      MODEL_HARD: ${MODEL_HARD:-}
    volumes:
      - agi_data:/data
      - agi_secrets:/secrets:ro
    read_only: true
    tmpfs: ["/tmp:rw,size=64m"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]         # only so the supervisor can drop the agent to uid 1001
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    networks: [default, agi_sandbox_net]
    depends_on:
      agi-init: { condition: service_completed_successfully }
      agi-sandbox: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  agi-sandbox:
    build: ./integrations/agi/sandbox
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN_FILE: /secrets/sandbox_token
    volumes:
      - agi_secrets:/secrets:ro
    user: "2000:2000"
    read_only: true
    tmpfs:
      - /work:rw,size=256m,mode=1777         # ephemeral workspace, wiped on restart
      - /tmp:rw,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    networks: [agi_sandbox_net]              # internal only: NO internet, NO route to the host
    depends_on:
      agi-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry backend for the AGI agent's traces: http://localhost:16686 (bound to loopback).
  agi-jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]

networks:
  agi_sandbox_net:
    internal: true                           # Docker blocks all external traffic on this network

volumes:
  xcoder-postgres-data:
  xcoder-codegraph-data:
  ollama_storage:
  agi_data:
  agi_secrets:
